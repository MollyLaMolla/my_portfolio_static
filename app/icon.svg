<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1" />
      <stop offset="50%" style="stop-color:#8b5cf6" />
      <stop offset="100%" style="stop-color:#a78bfa" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.15)" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)" />
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)" />
  <!-- Subtle shine overlay -->
  <rect width="512" height="256" rx="96" ry="96" fill="url(#shine)" />
  <!-- Code bracket left -->
  <text x="68" y="340" font-family="monospace, 'Courier New'" font-size="220" font-weight="bold" fill="rgba(255,255,255,0.25)">&lt;</text>
  <!-- Initials -->
  <text x="256" y="345" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="200" font-weight="700" fill="white" text-anchor="middle" letter-spacing="-8">AS</text>
  <!-- Code bracket right -->
  <text x="370" y="340" font-family="monospace, 'Courier New'" font-size="220" font-weight="bold" fill="rgba(255,255,255,0.25)">/&gt;</text>
  <!-- Bottom accent line -->
  <rect x="156" y="400" width="200" height="6" rx="3" fill="rgba(255,255,255,0.5)" />
</svg>
